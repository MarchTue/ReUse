[package]
name = "wasm_wallet"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.103"
serde = {version = "1.0.225", feature = ["derive"]}
serde_json = "1.0.145"
serde-wasm-bindgen = "0.6.5"

bip39 = "2.2.0"
bip32 = "0.5.3"
k256 = {version = "0.13.4", feature = ["ecdsa"], defualt-features = false}
sha3 = "0.10.8"
rand = "0.9.2" # random number generator
getrandom = "0.3.3" 
base64 = "0.22.1"

pbkdf2 = "0.12.2"
hmac = "0.12.1"
sha2 = "0.10.9"
aes-gcm = "0.10.3"
aes-gcm = "0.10.3"

console_error_panic_hook = {version = "0.1.7", optional = true}

[features]
default = []

