[package]
name = "wasm_wallet"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.103"
serde = {version = "1.0.225", features = ["derive"]}
serde_json = "1.0.145"
serde-wasm-bindgen = "0.6.5"

bip39 = { version = "2.2.0", features = ["rand"]}
bip32 = {version = "0.5.3", features =["alloc"]}
k256 = {version = "0.13.4", features = ["ecdsa", "pkcs8"]}
sha3 = "0.10.8"
rand = "0.8.5" # random number generator
getrandom = "0.2.14" 
base64 = "0.22.1"
hex = "0.4.3"
pbkdf2 = "0.12.2"
hmac = "0.12.1"
sha2 = "0.10.9"
aes-gcm = "0.10.3"

ethers-core = "2.0.13"
ethers-signers = "2.0.13"

console_error_panic_hook = {version = "0.1.7", optional = true}
wasm-bindgen-futures = "0.4.53"

[features]
default = []

